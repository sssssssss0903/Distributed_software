version: "3.8"

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seckill_user
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/sql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - seckill-net

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: seckill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - seckill-net

  # Nacos 服务注册发现 + 配置中心
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: seckill-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: ""
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - seckill-net

  # Sentinel Dashboard 流量治理控制台
  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: seckill-sentinel
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Xms128m -Xmx256m"
    ports:
      - "8858:8858"
    networks:
      - seckill-net

  # 后端服务实例 1 (端口 8081)
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODULE: seckill-user-service
    container_name: seckill-backend-1
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - seckill-net

  # 后端服务实例 2 (端口 8082)
  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODULE: seckill-user-service
    container_name: seckill-backend-2
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - seckill-net

  # 商品服务(含Redis缓存)
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODULE: seckill-product-service
    container_name: seckill-product-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - seckill-net

  # API网关
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODULE: seckill-gateway
    container_name: seckill-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD: sentinel:8858
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - seckill-net

  # Nginx 负载均衡与反向代理
  nginx:
    image: nginx:alpine
    container_name: seckill-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - gateway
    networks:
      - seckill-net

volumes:
  mysql_data:
  redis_data:
  nacos_data:

networks:
  seckill-net:
    driver: bridge
